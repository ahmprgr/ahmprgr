<svg fill="none" viewBox="0 0 1200 400" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#05070A"/>
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="50%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#39FF14"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="400" rx="16" fill="url(#bg-grad)"/>
  <rect width="1200" height="400" rx="16" fill="url(#grid)"/>

  <!-- Geometric Cyber Elements -->
  <circle cx="1100" cy="80" r="180" fill="#00FF88" opacity="0.04" filter="url(#glow)"/>
  <circle cx="100" cy="320" r="140" fill="#58A6FF" opacity="0.04" filter="url(#glow)"/>

  <!-- Glowing Top Border Accent Line -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent-grad)"/>

  <!-- Terminal Frame -->
  <rect x="80" y="60" width="1040" height="280" rx="12" fill="#0D1117" stroke="#161B22" stroke-width="2"/>
  <rect x="80" y="60" width="1040" height="40" rx="12" fill="#161B22"/>
  <!-- Circle buttons -->
  <circle cx="110" cy="80" r="6" fill="#FF5F56"/>
  <circle cx="130" cy="80" r="6" fill="#FFBD2E"/>
  <circle cx="150" cy="80" r="6" fill="#27C93F"/>
  <text x="600" y="85" fill="#8B949E" font-family="'Fira Code', Monaco, monospace" font-size="13" text-anchor="middle">ahmprgr@fedora:~</text>

  <!-- Content Lines -->
  <text x="120" y="145" fill="#00FF88" font-family="'Fira Code', Monaco, monospace" font-size="28" font-weight="bold">AMIRHOSSEIN MAHMOUDIAN</text>
  <text x="120" y="185" fill="#58A6FF" font-family="'Fira Code', Monaco, monospace" font-size="18">► Senior Backend Engineer &amp; System Architect Aspirant</text>

  <!-- Tech Badges inside Banner -->
  <g transform="translate(120, 220)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="130" height="32" rx="6" fill="#161B22" stroke="#00FF88" stroke-width="1"/>
    <text x="65" y="21" fill="#00FF88" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">NODE.JS</text>

    <!-- Badge 2 -->
    <rect x="145" y="0" width="130" height="32" rx="6" fill="#161B22" stroke="#58A6FF" stroke-width="1"/>
    <text x="210" y="21" fill="#58A6FF" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">LINUX / POSIX</text>

    <!-- Badge 3 -->
    <rect x="290" y="0" width="130" height="32" rx="6" fill="#161B22" stroke="#39FF14" stroke-width="1"/>
    <text x="355" y="21" fill="#39FF14" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">AI OLYMPIAD</text>

    <!-- Badge 4 -->
    <rect x="435" y="0" width="130" height="32" rx="6" fill="#161B22" stroke="#FFFFFF" stroke-width="1"/>
    <text x="500" y="21" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">NESTJS</text>
  </g>

  <!-- Prompt line at bottom -->
  <text x="120" y="300" fill="#8B949E" font-family="'Fira Code', Monaco, monospace" font-size="14">
    <tspan fill="#00FF88">ahmprgr@fedora</tspan>:<tspan fill="#58A6FF">~</tspan>$ ./initiate_session.sh --status=READY
  </text>
</svg>
